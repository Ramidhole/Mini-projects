<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password genrator -javascript project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h2>Password-Generator</h2>

        <div class="inputbox">
            <input type="text" class="passBox" id="passBox" disabled>

        </div>
        <input type="range" min="1" max="30" value="8" id="inputSlider">
    
<div class="row">
    <p>password length</p>
    <span id="sliderValue"></span>
</div>

<div class="row">
<label for="lowercase">Lowercase Letters(a-z)</label>
<input type="checkbox" name="Lowercase" id="lowercase">
</div>


<div class="row">
<label for="uppercase">Uppercase Letters(A-Z)</label>
<input type="checkbox" name="Uppercase" id="uppercase">
</div>

<div class="row">
<label for="numbers">Numbers (0-9)</label>
<input type="checkbox" name="Numbers" id="numbers">
</div>

<div class="row">
<label for="symbols">Symbols(!@#$%)</label>
<input type="checkbox" name="Symbols" id="symbols">
</div>
<button type="button" class="genbtn" id="genbtn"> Generate Password</button>


</div>



<p></p>

    <script src="script.js"></script>
</body>

</html>
