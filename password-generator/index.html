<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password genrator -javascript project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h2>Password-Generator</h2>

        <div class="inputbox">
            <input type="text" class="pass" disabled>

        </div>
        <input type="range" min="8" max="20" value="8">
    
<div class="row">
    <p>password length</p>
    <span>4</span>
</div>

<div class="row">
<label for="Lowercase">Lowercase Letters(a-z)</label>
<input type="checkbox" name="Lowercase" id="Lowercase">
</div>


<div class="row">
<label for="Uppercase">Uppercase Letters(A-Z)</label>
<input type="checkbox" name="Uppercase" id="Uppercase">
</div>

<div class="row">
<label for="Numbers">Numbers (0-9)</label>
<input type="checkbox" name="Numbers" id="Numbers">
</div>

<div class="row">
<label for="Symbols">Symbols(!@#$%)</label>
<input type="checkbox" name="Symbols" id="Symbols">
</div>
<button type="button" class="genbtn"> Generate Password</button>


</div>



<p></p>

    <script src="script.js"></script>
</body>

</html>
